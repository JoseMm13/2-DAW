<html lang="en">

<head>
  <title>SanviPop</title>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
  <link rel="stylesheet" href="styles.css">
  <script src="exercise3.js" defer></script>
</head>

<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">SanviPop</a>
    </div>
  </nav>

  <div class="container">
    <form action="#" class="mt-4" id="newProduct">
      <div class="mb-3">
        <label for="title">Title</label>
        <input type="text" class="form-control" name="title" id="title" placeholder="Product name" required minlength="4">
        <div class="invalid-feedback">Title is required and must be at least 4 characters long.</div>
      </div>
      <div class="mb-3">
        <label for="description">Description</label>
        <textarea class="form-control" id="description" name="description" rows="3" placeholder="Description..." required></textarea>
        <div class="invalid-feedback">Description is required.</div>
      </div>
      <div class="mb-3">
        <label for="price">Price</label>
        <input type="number" step="0.01" class="form-control" name="price" id="price" placeholder="Price" required min="0.01">
        <div class="invalid-feedback">Price is required and must be greater than zero.</div>
      </div>
      <div class="mb-3">
        <label for="category">Category</label>
        <select id="category" class="form-select" name="category" required>
          <option value="" selected>Choose a category...</option>
          <option value="1">Electronics</option>
          <option value="2">Vehicles and motor</option>
          <option value="3">Sports and hobbies</option>
          <option value="4">Other</option>
        </select>
        <div class="invalid-feedback">You must select a category.</div>
      </div>
      <div class="mb-3">
        <label for="image">Main photo</label>
        <input type="file" class="form-control" id="image" name="image" accept="image/*" required>
        <div class="invalid-feedback">Photo is required and less than 200KB.</div>
      </div>
      <img src="" alt="" id="imgPreview" class="img-thumbnail d-none mb-3">

      <div>
        <button type="submit" class="btn btn-primary btn-lg">Create</button>
      </div>
      
    </form>

    <div id="productsContainer" class="mb-4 mt-4 row row-cols-1 row-cols-md-2 row-cols-xl-3 g-4">
      <div class="col">
        <div class="card h-100 shadow">
          <img class="card-img-top" src="./img/chicken.jpg">
          <div class="card-body">
            <h5 class="card-title">Rubber Chicken</h5>
            <p class="card-text">Create symphonies with this chicken.</p>
            <button type="button" class="btn btn-danger btn-delete">Delete</button>
          </div>
          <div class="card-footer bg-transparent text-muted">
            <div class="row">
              <div class="col category">Category</div>
              <div class="col text-end price">100 €</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

</body>

</html>

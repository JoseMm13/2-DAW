<html lang="en">

<head>
  <title>SanviPop</title>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">

<body>
  <nav class="navbar navbar-expand navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">SanviPop Lite</a>
        <ul class="navbar-nav me-auto mb-lg-0">
        <li class="nav-item">
            <a class="nav-link active" href="index.html">Home</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" href="new-product.html">New product</a>
        </li>
        </ul>
    </div>
  </nav>

  <div class="container">
    <nav class="navbar navbar-light bg-light justify-content-between mt-3">
      <form class="container-fluid">
        <input class="form-control" type="text" name="search" id="search" 
            placeholder="Search" aria-label="Search">
      </form>
    </nav>
    
    <div id="products-container" class="mb-4 mt-4 row row-cols-1 row-cols-md-2 row-cols-xl-3 g-4">

  <template id="product-template">

            <button type="button" class="btn btn-danger btn-delete">Delete</button>
          </div>
          <div class="card-footer bg-transparent text-muted">
            <div class="row">
              <div class="col category"></div>
              <div class="col text-end price"></div>
            </div>
          </div>
        </div>

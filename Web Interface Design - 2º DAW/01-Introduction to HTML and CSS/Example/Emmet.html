<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- meta[name="author" content="Tu Nombre"] -->
    <meta name="author" content="Rosa Medina">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplos EMMET - HTML</title>
    <!-- Atajos del teclado para programar más rápido -->
     <!-- El primero de ellos será crear el archivo de html usando la ! -->
</head>
<body>
    <!-- Para crearnos un elemento dentro de otro usamos el símbolo > -->
     <header>
        <nav>
            <ul>
                <li></li>
            </ul>
        </nav>
     </header>
     <!-- Para crear elementos hermanos usaremos el símbolo del + -->
     <main>
        <!-- Para crear varios elementos iguales * -->
        <!-- Si esos elementos queremos que tengan un atributo class con un selector de clase usaremos el punto -->
         <!-- Si queremos que cada elemento tenga un número en función de si es el ítem 1 o el 25 usaremos el $ -->
          <article class="article1">
            <!-- Si en lugar de ser una clase quisiéramos crearnos un identificador sería con la # -->
             <!-- Si queremos que ese elemento contenga un texto usaremos las llaves {} -->
             <p id="publicacion1">Mi primera publicación</p>
             <!-- Si queremos concatenar varias clases o varios elementos sería ponerlos uno a continuación del otro -->
              <img src="" alt="" class="foto destacada" id="imagen1">
          </article>
          <article class="article2">
            <!-- Si queremos personalizar de un golpe un determinado atributo usamos los corchetes [atributo] -->
             <img src="" alt="Imágenes de nuestro card" id="imagen2">
             <!-- Hay muchos atajos de elementos que están asociados a sus atributos como input:text, input:radio... -->
          </article>
          <article class="article3">
          </article>
          <article class="article4"></article>
          <article class="article5"></article>
     </main>
     <footer></footer>
</body>
</html>
